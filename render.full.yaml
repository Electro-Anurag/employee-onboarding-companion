# Submission candidate: review paid worker plan before applying.
# Only synthetic demo data is permitted. No private identity PDFs.
# Manual deployments keep branch development from silently going live.
databases:
  - name: eoc-companion-postgres
    databaseName: eoccompanion
    user: eoccompanion
    region: singapore
    plan: free
    ipAllowList: []

services:
  - type: web
    name: eoc-companion-web
    runtime: docker
    plan: free
    region: singapore
    branch: feature/m5-m6-parallel-development
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    # Explicit argv-safe script: Render must not parse a nested shell string.
    dockerCommand: /bin/sh /app/backend/start_web.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eoc-companion-postgres
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: M3_REAL_DOCUMENT_ENABLED
        value: "0"
      - key: M3_QUARANTINE_INTAKE_ENABLED
        value: "0"
      - key: EOC_AI_PROVIDER
        value: "DISABLED"

  - type: worker
    name: eoc-companion-control-worker
    runtime: docker
    plan: starter
    region: singapore
    branch: feature/m5-m6-parallel-development
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python manage.py procrastinate worker --queues control
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eoc-companion-postgres
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: eoc-companion-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
        value: "0"
      - key: M3_REAL_DOCUMENT_ENABLED
        value: "0"
      - key: M3_QUARANTINE_INTAKE_ENABLED
        value: "0"
      - key: EOC_HOSTED_DEMO_BOOTSTRAP
        value: "0"
