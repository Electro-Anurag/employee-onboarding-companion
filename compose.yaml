# M0 only: no hosting, AWS or model provisioning. This is a local test environment.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: onboarding_m0
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding -d onboarding_m0"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - m0db:/var/lib/postgresql/data
  web:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
  control-worker:
    build: .
    command: ["python", "manage.py", "procrastinate", "worker", "control"]
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
volumes:
  m0db:
