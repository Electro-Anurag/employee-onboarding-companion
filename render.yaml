# Default Render Blueprint: zero-paid-compute evaluation, NOT full hosted acceptance.
# Complete paid-worker architecture is preserved in render.full.yaml.
# No external AI/provider billing, no secure S3 document intake.
# Free web spins down; free PostgreSQL expires after 30 days; no backups.
databases:
  - name: eoc-companion-postgres
    databaseName: eoccompanion
    user: eoccompanion
    region: singapore
    plan: free
    ipAllowList: []

services:
  - type: web
    name: eoc-companion-web
    runtime: docker
    plan: free
    region: singapore
    branch: feature/m5-m6-parallel-development
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    # Explicit argv-safe script: Render must not parse a nested shell string.
    dockerCommand: /bin/sh /app/backend/start_web.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eoc-companion-postgres
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: M3_REAL_DOCUMENT_ENABLED
        value: "0"
      - key: M3_QUARANTINE_INTAKE_ENABLED
        value: "0"
      - key: EOC_AI_PROVIDER
        value: "DISABLED"
