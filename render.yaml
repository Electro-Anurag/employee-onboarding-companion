# Submission candidate: review paid worker plan before applying.
# Only synthetic demo data is permitted. No private identity PDFs.
# Manual deployments keep branch development from silently going live.
databases:
  - name: eoc-companion-postgres
    databaseName: eoccompanion
    user: eoccompanion
    region: singapore
    plan: free
    ipAllowList: []

services:
  - type: web
    name: eoc-companion-web
    runtime: docker
    plan: free
    region: singapore
    branch: feature/m5-m6-parallel-development
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    dockerCommand: >-
      /bin/sh -c 'python manage.py migrate --noinput &&
      exec gunicorn backend.config.wsgi:application
      --bind 0.0.0.0:${PORT:-10000}
      --workers 2 --access-logfile - --error-logfile -'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eoc-companion-postgres
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: M3_REAL_DOCUMENT_ENABLED
        value: "0"
      - key: M3_QUARANTINE_INTAKE_ENABLED
        value: "0"

  - type: worker
    name: eoc-companion-control-worker
    runtime: docker
    plan: starter
    region: singapore
    branch: feature/m5-m6-parallel-development
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python manage.py procrastinate worker --queues control
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eoc-companion-postgres
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: eoc-companion-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
        value: "0"
      - key: M3_REAL_DOCUMENT_ENABLED
        value: "0"
      - key: M3_QUARANTINE_INTAKE_ENABLED
        value: "0"
