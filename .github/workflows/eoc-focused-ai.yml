name: EOC M6 grounded relevance qualification
on:
  push:
    branches: ['feature/eoc-completion-development', 'feature/eoc-postsubmission-completion']
    paths:
      - 'backend/ai/**'
      - '.github/workflows/eoc-focused-ai.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grounded-ai-offline-postgresql:
    runs-on: [self-hosted, linux, ARM64, eoc-mac-ci]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: ci-temporary-only
          POSTGRES_DB: onboarding_m0
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DJANGO_SECRET_KEY: ci-only-not-production-credential
      DJANGO_DEBUG: '0'
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: onboarding_m0
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: ci-temporary-only
      EOC_AI_PROVIDER: DISABLED
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: '3.13'
          version: '0.12.23'
      - name: Locked dependencies, Django and migrations
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked
          uv run python -m compileall -q backend/ai
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py migrate --noinput
      - name: Run real PostgreSQL M6 adversarial source and request relevance qualification
        run: |
          set -euo pipefail
          uv run pytest -q backend/ai/tests
          echo "EOC_M6_EXACT_EVIDENCE_RELEVANCE_PASS@$GITHUB_SHA"
