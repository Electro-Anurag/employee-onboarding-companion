name: M5-M6 branch integrated qualification
on:
  push:
    branches: ['feature/m5-m6-parallel-development']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m5-m6-postgresql:
    runs-on: [self-hosted, linux, ARM64, eoc-mac-ci]
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: ci-temporary-only
          POSTGRES_DB: onboarding_m0
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DJANGO_SECRET_KEY: ci-only-no-production-secret-not-used-outside-runner
      DJANGO_DEBUG: '0'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: onboarding_m0
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: ci-temporary-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: '3.13'
          version: '0.12.23'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify pinned dependencies
        run: uv lock --check && uv sync --locked
      - name: Django and migration consistency
        run: |
          uv run python -m compileall -q backend manage.py
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py migrate --noinput
          uv run python manage.py procrastinate healthchecks
      - name: All real PostgreSQL backend regressions and new M5-M6 tests
        run: uv run pytest -q
      - name: Frontend regression and build
        working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run build
      - name: Locked dependency manifests unchanged
        run: git diff --exit-code -- uv.lock frontend/package-lock.json
