name: M5-M6 real exception Chromium acceptance
on:
  push:
    branches: ['feature/m5-m6-parallel-development']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exception-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: ci-temporary-only
          POSTGRES_DB: onboarding_m0
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DJANGO_SECRET_KEY: ci-only-no-production-secret-not-used-outside-runner
      DJANGO_DEBUG: '1'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: onboarding_m0
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: ci-temporary-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: '3.13'
          version: '0.12.23'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Locked dependencies and compiled product UI
        run: |
          uv lock --check
          uv sync --locked
          cd frontend
          npm ci
          npm run build
      - name: Migrate isolated case, exception, audit and queue schema
        run: uv run python manage.py migrate --noinput
      - name: Install standalone Chromium runner
        run: |
          mkdir -p "$RUNNER_TEMP/m5-playwright"
          cp browser/playwright.config.cjs browser/m5-exceptions.spec.cjs "$RUNNER_TEMP/m5-playwright/"
          npm --prefix "$RUNNER_TEMP/m5-playwright" install --no-save --package-lock=false --ignore-scripts @playwright/test@1.64.0
          "$RUNNER_TEMP/m5-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real UI two-role guarded blocker/typed recovery
        run: |
          set -euo pipefail
          umask 077
          export M5_BROWSER_CREDENTIAL_FILE="$RUNNER_TEMP/m5-browser-secrets.txt"
          uv run python manage.py seed_m5_browser --confirm-synthetic > "$M5_BROWSER_CREDENTIAL_FILE"
          setsid uv run python manage.py runserver --nostatic --noreload 127.0.0.1:8000 > "$RUNNER_TEMP/m5-web.log" 2>&1 &
          server_pid=$!
          cleanup() {
            set +e
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            sleep 1
            kill -KILL -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -f "$M5_BROWSER_CREDENTIAL_FILE"
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 50); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/health/ready; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            tail -80 "$RUNNER_TEMP/m5-web.log"
            exit 1
          fi
          cd "$RUNNER_TEMP/m5-playwright"
          timeout -k 5s 220s ./node_modules/.bin/playwright test -c playwright.config.cjs m5-exceptions.spec.cjs
          echo M5_REAL_CHROMIUM_EXCEPTION_TYPED_RECOVERY_PASS
