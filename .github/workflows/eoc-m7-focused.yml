name: EOC M7 closeout readiness qualification
on:
  push:
    branches: ['feature/eoc-completion-development']
    paths:
      - 'backend/onboarding/closeout.py'
      - 'backend/onboarding/api_m2.py'
      - 'backend/onboarding/dashboard.py'
      - 'backend/onboarding/portfolio.py'
      - 'backend/onboarding/tests/test_closeout.py'
      - 'backend/onboarding/tests/test_dashboard.py'
      - 'backend/onboarding/tests/test_portfolio.py'
      - 'backend/config/urls.py'
      - 'frontend/src/App.tsx'
      - 'frontend/src/CaseDashboard.tsx'
      - 'frontend/src/CaseDashboard.test.tsx'
      - 'frontend/src/PortfolioOverview.tsx'
      - 'frontend/src/PortfolioOverview.test.tsx'
      - '.github/workflows/eoc-m7-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-m7-closeout:
    runs-on: [self-hosted, linux, ARM64, eoc-mac-ci]
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: ci-temporary-only
          POSTGRES_DB: onboarding_m0
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DJANGO_SECRET_KEY: ci-only-no-production-secret-not-used-outside-runner
      DJANGO_DEBUG: '0'
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: onboarding_m0
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: ci-temporary-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: '3.13'
          version: '0.12.23'
      - name: Verify code, migrations and frozen dependencies
        run: |
          uv lock --check
          uv sync --locked
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py migrate --noinput
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: M7 closeout and readiness API PostgreSQL tests
        run: uv run pytest -q backend/onboarding/tests/test_closeout.py backend/onboarding/tests/test_dashboard.py backend/onboarding/tests/test_portfolio.py
      - name: React regression and build
        working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run build
