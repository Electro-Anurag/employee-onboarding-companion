name: D5 cross-tenant HTTP authority and CSRF matrix
on:
  push:
    branches: ['feature/eoc-completion-development']
    paths:
      - '.github/workflows/eoc-d5-tenant-isolation.yml'
      - 'backend/onboarding/tests/test_d5_isolation_matrix.py'
      - 'backend/onboarding/services.py'
      - 'backend/onboarding/api_m2.py'
      - 'backend/accounts/security.py'
      - 'backend/accounts/middleware.py'
      - 'backend/documents/real_views.py'
      - 'backend/ai/context.py'
      - 'backend/notifications/views.py'
      - 'backend/notifications/tests/test_d5_outage_boundary.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eoc-d5-tenant-isolation
  cancel-in-progress: false
jobs:
  isolation:
    runs-on: [self-hosted, linux, ARM64, eoc-mac-ci]
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: ci-temporary-only
          POSTGRES_DB: onboarding_m0
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-credential
      DJANGO_DEBUG: '0'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      EOC_AI_PROVIDER: DISABLED
      OPENAI_API_KEY: ''
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: onboarding_m0
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: ci-temporary-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: '3.13'
          version: '0.12.23'
      - name: Lock and inspect Django database state
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py migrate --noinput
      - name: Adversarial cross-tenant HTTP matrix and existing concurrency security
        run: |
          set -euo pipefail
          uv run pytest -q \
            backend/onboarding/tests/test_d5_isolation_matrix.py \
            backend/onboarding/tests/test_authority_interleavings.py \
            backend/onboarding/tests/test_security.py \
            backend/onboarding/tests/test_review_repairs.py \
            backend/notifications/tests/test_d5_outage_boundary.py
          echo "EOC_D5_TENANT_HTTP_CSRF_REASSIGNMENT_PASS@$GITHUB_SHA"
      - name: No drift in dependency lock
        run: git diff --exit-code -- uv.lock frontend/package-lock.json
