name: M3 live S3 and ClamAV document saga
on:
  push:
    branches: ['feature/eoc-completion-development']
    paths:
      - 'backend/documents/**'
      - 'backend/onboarding/migrations/0017_secure_s3_document_completion.py'
      - 'backend/onboarding/migrations/0018_restore_activity_cancellation_authority.py'
      - 'backend/activities/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/m3-live-services.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s3-and-clamd:
    runs-on: [self-hosted, linux, ARM64, eoc-mac-ci]
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: onboarding_m0
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: ci-temporary-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-temporary-strong-secret
      DJANGO_DEBUG: '0'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: onboarding_m0
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: ci-temporary-only
      M3_REAL_DOCUMENT_ENABLED: '1'
      M3_S3_QUARANTINE_BUCKET: ci-m3-private-quarantine
      M3_S3_CLEAN_BUCKET: ci-m3-private-clean
      M3_S3_ENDPOINT_URL: http://127.0.0.1:9000
      M3_S3_ALLOW_LOCAL_TEST_ENDPOINT: '1'
      M3_S3_REGION: us-east-1
      M3_CLAMAV_HOST: 127.0.0.1
      M3_CLAMAV_PORT: '3310'
      AWS_ACCESS_KEY_ID: ci-minio-only
      AWS_SECRET_ACCESS_KEY: ci-minio-temporary-password
      M3_LIVE_S3_CLAMAV: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: '3.13'
          version: '0.12.23'
      - name: Install locked application and migration schema
        run: |
          uv lock --check
          uv sync --locked
          uv run python manage.py migrate --noinput
      - name: Start isolated S3-compatible store and actual ClamAV
        run: |
          set -euo pipefail
          docker run --detach --name m3-minio --rm \
            -e MINIO_ROOT_USER=ci-minio-only \
            -e MINIO_ROOT_PASSWORD=ci-minio-temporary-password \
            -p 127.0.0.1:9000:9000 \
            chainguard/minio:latest server /data
          docker run --detach --name m3-clamd --rm \
            -p 127.0.0.1:3310:3310 clamav/clamav:1.4
      - name: Wait for S3, enable immutable versions, and require fresh actual clamd
        run: |
          uv run python - <<'PY'
          import os
          import time
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','backend.config.settings')
          import django
          django.setup()
          from backend.documents import storage
          from backend.documents.scanner import clamav_signature_provenance,ScannerUnavailable
          s3=storage.client()
          buckets=[storage.settings.M3_S3_QUARANTINE_BUCKET,storage.settings.M3_S3_CLEAN_BUCKET]
          for i in range(150):
              try:
                  s3.list_buckets()
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError('S3 store unavailable')
          for bucket in buckets:
              s3.create_bucket(Bucket=bucket)
              s3.put_bucket_versioning(Bucket=bucket,VersioningConfiguration={'Status':'Enabled'})
          storage.buckets(s3)
          # Emit bounded failure codes, not raw document bytes or secrets.
          # This is an actual ClamAV readiness gate, never a mocked success.
          last_reason='NOT_ATTEMPTED'
          reload_requested=False
          for i in range(60):
              try:
                  info=clamav_signature_provenance()
                  print('CLAMAV_FRESH_REAL_SIGNATURES: '+info)
                  break
              except ScannerUnavailable as exc:
                  reason=str(exc)
              except Exception as exc:
                  reason='UNEXPECTED_'+type(exc).__name__
              if reason!=last_reason or i%10==0:
                  print(f'CLAMAV_READINESS_CHECK: attempt={i+1} reason={reason}',flush=True)
              if reason=='STALE_SCANNER_SIGNATURES' and not reload_requested:
                  # CI-only local daemon reload. FreshClam updates the mounted
                  # database on disk but its default socket notification fails;
                  # clamd may still have the stale startup database in memory.
                  # This does not bypass or weaken the 48-hour freshness gate.
                  import socket
                  try:
                      with socket.create_connection(('127.0.0.1',3310),timeout=2) as channel:
                          channel.settimeout(2)
                          channel.sendall(b'zRELOAD'+bytes([0]))
                          reply=channel.recv(128).rstrip(bytes([0,10,13]))
                          if reply!=b'RELOADING':
                              raise RuntimeError('ClamAV reload refused: '+repr(reply[:80]))
                      print('CLAMAV_REAL_SIGNATURE_RELOAD_REQUESTED',flush=True)
                      reload_requested=True
                  except OSError as exc:
                      print('CLAMAV_RELOAD_CONNECT_FAILED: '+type(exc).__name__,flush=True)
              if reason=='STALE_SCANNER_SIGNATURES' and last_reason!=reason:
                  # Diagnostic: clamd VERSION contains only public engine/db metadata.
                  import socket
                  try:
                      with socket.create_connection(('127.0.0.1',3310),timeout=2) as channel:
                          channel.settimeout(2)
                          channel.sendall(b'zVERSION\\0'.replace(b'\\0',bytes([0])))
                          version=channel.recv(180).split(bytes([0]))[0]
                          print('CLAMAV_VERSION_DIAGNOSTIC: '+repr(version[:150]),flush=True)
                  except OSError as exc:
                      print('CLAMAV_VERSION_PROBE_FAILED: '+type(exc).__name__,flush=True)
              last_reason=reason
              time.sleep(2)
          else:
              raise RuntimeError('Actual ClamAV daemon with recent definitions unavailable: '+last_reason)
          PY
      - name: Live S3 and ClamAV malware, clean promotion and HR review
        run: uv run pytest -q backend/documents/tests/test_s3_live.py
      - name: Report scanner container status on any failure
        if: failure()
        run: |
          docker ps -a
          docker logs --tail 60 m3-clamd || true
          docker logs --tail 30 m3-minio || true
      - name: Stop isolated test services
        if: always()
        run: |
          docker rm --force m3-clamd m3-minio || true
